<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b16" />
  <title>Sedang Offline · Web Klinik</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f7fc; --card:#fff; --fg:#0f172a; --muted:#64748b; --border:#e2e8f0; }
    @media (prefers-color-scheme: dark) { :root { --bg:#070b16; --card:#101a30; --fg:#e6ecf5; --muted:#8b9bb8; --border:#1f2c4a; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(60% 45% at 50% 0%, rgba(37,99,235,.25) 0%, transparent 70%), var(--bg); color: var(--fg); }
    .card { max-width: 420px; width:100%; background: var(--card); border:1px solid var(--border); border-radius:22px; padding:32px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.2); }
    .logo { width:56px; height:56px; border-radius:16px; margin:0 auto 16px; background:linear-gradient(135deg,#2563eb,#06b6d4); display:flex; align-items:center; justify-content:center; }
    h1 { font-size:20px; margin:0 0 8px; }
    p { color: var(--muted); font-size:14px; line-height:1.55; margin:0 0 20px; }
    button { border:0; cursor:pointer; color:#fff; font-weight:700; font-size:14px; height:44px; padding:0 22px; border-radius:12px;
      background:linear-gradient(135deg,#2563eb,#06b6d4); box-shadow:0 6px 18px rgba(37,99,235,.35); }
    small { display:block; margin-top:18px; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <h1>Anda sedang offline</h1>
    <p>Koneksi internet terputus. Percakapan dan data kesehatan tidak disimpan di perangkat demi privasi, jadi sambungkan kembali untuk melanjutkan.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
    <small>Keadaan darurat? Segera hubungi 119 atau IGD terdekat.</small>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
