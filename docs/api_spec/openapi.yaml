components:
  schemas:
    AdminFeedbackUpdateRequest:
      properties:
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        adjusted_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Adjusted Score
        feedback_type:
          anyOf:
          - type: string
            pattern: ^(LIKE|DISLIKE|like|dislike)$
          - type: 'null'
          title: Feedback Type
      type: object
      title: AdminFeedbackUpdateRequest
    AnnotationRequest:
      properties:
        document_id:
          type: string
          title: Document Id
          description: ID dokumen atau rekam klinis
        annotation_label:
          type: string
          title: Annotation Label
          description: 'Label anotasi terstandarisasi (contoh: Kardiologi, Reasoning
            Error: Contraindicated Drug)'
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
          description: Catatan justifikasi klinis annotator
      type: object
      required:
      - document_id
      - annotation_label
      title: AnnotationRequest
    AuditLogResponse:
      properties:
        id:
          type: string
          title: Id
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        action:
          type: string
          title: Action
        resource_type:
          type: string
          title: Resource Type
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        status:
          type: string
          title: Status
        ip_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip Address
        details:
          anyOf:
          - type: string
          - type: 'null'
          title: Details
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - user_id
      - action
      - resource_type
      - resource_id
      - status
      - ip_address
      - details
      - created_at
      title: AuditLogResponse
    Body_upload_dataset_file_api_v1_admin_datasets_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_dataset_file_api_v1_admin_datasets_upload_post
    ChatMessageRequest:
      properties:
        session_id:
          type: string
          title: Session Id
          description: ID sesi percakapan klinis aktif
        content:
          type: string
          maxLength: 2000
          minLength: 1
          title: Content
          description: Pesan pertanyaan pengguna
        reasoning_mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoning Mode
          description: 'Mode penalaran: ''thinking'' (17 ML & 8 DL) atau ''fast''
            (5 ML & 2 DL)'
          default: thinking
      type: object
      required:
      - session_id
      - content
      title: ChatMessageRequest
    CreateSessionRequest:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Title
          default: Konsultasi Klinis Baru
      type: object
      title: CreateSessionRequest
    EdgeCreate:
      properties:
        source:
          type: string
          maxLength: 100
          minLength: 1
          title: Source
        target:
          type: string
          maxLength: 100
          minLength: 1
          title: Target
        relation:
          type: string
          maxLength: 50
          title: Relation
        reason:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Reason
          default: ''
      type: object
      required:
      - source
      - target
      - relation
      title: EdgeCreate
    ExportRequest:
      properties:
        model_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Name
          description: Nama model untuk export manifest
          default: CardioClassifier
        include_figures:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Figures
          description: Render dan sertakan figur grafik PNG
          default: true
        include_csv:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Csv
          description: Sertakan file CSV prediksi per sampel
          default: true
      type: object
      title: ExportRequest
    FeedbackRequest:
      properties:
        session_id:
          type: string
          title: Session Id
        message_id:
          type: string
          title: Message Id
        feedback_type:
          type: string
          pattern: ^(LIKE|DISLIKE)$
          title: Feedback Type
          description: '''LIKE'' (Reward Positif) atau ''DISLIKE'' (Penalti RLHF)'
        improvement_category:
          anyOf:
          - type: string
          - type: 'null'
          title: Improvement Category
          description: 'Kategori perbaikan: ''BAHASA_TERLALU_MEDIS'', ''INFORMASI_KURANG_LENGKAP'',
            ''RUJUKAN_TIDAK_TEPAT'', ''PROTOKOL_KURANG_RELEVAN'', ''KURANG_EMPATIK'',
            atau ''LAINNYA'''
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
          description: Catatan perbaikan klinis kontekstual dari pasien atau tenaga
            medis
      type: object
      required:
      - session_id
      - message_id
      - feedback_type
      title: FeedbackRequest
    ForgotPasswordRequest:
      properties:
        username_or_email:
          type: string
          maxLength: 150
          minLength: 3
          title: Username Or Email
      type: object
      required:
