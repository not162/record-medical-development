openapi: 3.1.0
info:
  title: Klinik Terpadu API
  description: Full-Stack Evidence-Grounded Clinical AI Assistant & Research Suite
    (Klinik Terpadu)
  version: 2.0.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Authentication & Profile
      summary: Register User
      description: 'Registrasi Pengguna Standar (Peran USER).

        Sesuai regulasi keamanan & UU PDP No. 27/2022:

        - Rute publik ini TIDAK DAPAT digunakan untuk mendaftar sebagai ADMIN.

        - Menolak pendaftaran dengan username khusus admin.

        - Menolak pendaftaran jika akun/nama/email sudah terdaftar.'
      operationId: register_user_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication & Profile
      summary: Login User
      description: 'Autentikasi Pengguna dan Penerbitan Token JWT Terproteksi.

        Mendukung lazy migration password dan pencarian case-insensitive.'
      operationId: login_user_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication & Profile
      summary: Logout User
      description: Logout Sesi Pengguna.
      operationId: logout_user_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/v1/auth/me:
    get:
      tags:
      - Authentication & Profile
      summary: Get Current User Profile
      description: Mengambil data akun pengguna yang sedang aktif dari klaim JWT terverifikasi.
      operationId: get_current_user_profile_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/profile:
    get:
      tags:
      - Clinical Chat
      summary: Get User Profile
      description: Mengambil profil akun pasien / tenaga klinis terdaftar.
      operationId: get_user_profile_api_v1_profile_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
    put:
      tags:
      - Authentication & Profile
      summary: Update Patient Profile
      description: Memperbarui profil pribadi dan preferensi kesehatan pengguna.
      operationId: update_patient_profile_api_v1_profile_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/auth/forgot-password:
    post:
      tags:
      - Authentication & Profile
      summary: Forgot Password Request
      description: 'Permintaan Pemulihan Kata Sandi (UU PDP No. 27/2022).

        Menerbitkan kode verifikasi pemulihan untuk akun yang valid.'
      operationId: forgot_password_request_api_v1_auth_forgot_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/reset-password:
    post:
      tags:
      - Authentication & Profile
      summary: Reset Password
      description: Mereset Kata Sandi Pengguna dengan Kode Verifikasi yang Sah.
      operationId: reset_password_api_v1_auth_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/dashboard:
    get:
      tags:
      - Administrator Workspace
      summary: Get Admin Dashboard Summary
      description: 'Ringkasan Metrik Operasional Workspace Administrator.

        Memerlukan hak akses ADMIN server-side.

        Dioptimalkan dengan Redis Caching (TTL 30 detik).'
      operationId: get_admin_dashboard_summary_api_v1_admin_dashboard_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/v1/admin/audit-logs:
    get:
      tags:
      - Administrator Workspace
      summary: Get Audit Logs
      description: 'Mengambil Log Audit Keamanan dan Akses Sistem.

        Hanya dapat diakses oleh ADMINISTRATOR.'
      operationId: get_audit_logs_api_v1_admin_audit_logs_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogResponse'
                title: Response Get Audit Logs Api V1 Admin Audit Logs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users:
    get:
      tags:
      - Administrator Workspace
      summary: List System Users
      description: Melihat daftar pengguna terdaftar untuk pengawasan keamanan administratif.
      operationId: list_system_users_api_v1_admin_users_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
                title: Response List System Users Api V1 Admin Users Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users/manage:
    get:
      tags:
      - Administrator Workspace
      summary: List Users For Role Management
      description: Daftar akun lengkap untuk Admin Periset (kelola peran dan status
        akun).
      operationId: list_users_for_role_management_api_v1_admin_users_manage_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: role
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
                title: Response List Users For Role Management Api V1 Admin Users
                  Manage Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users/{user_id}:
    patch:
      tags:
      - Administrator Workspace
      summary: Update User Role Or Status
      description: Ubah peran atau aktif/nonaktif akun. Tidak boleh mengubah diri
        sendiri atau Admin Periset terakhir.
      operationId: update_user_role_or_status_api_v1_admin_users__user_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAdminUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/adaptation/status:
    get:
      tags:
      - Administrator Workspace
      summary: Get Adaptation Status
      description: Status penyesuaian otomatis model keputusan (tahap, progres, waktu,
        metrik). Hanya Admin Riset.
      operationId: get_adaptation_status_api_v1_admin_adaptation_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/v1/admin/datasets:
    get:
      tags:
      - Administrator Workspace
      summary: List Datasets
      description: 'Mengambil inventaris seluruh rekam dataset klinis yang telah diingesti.

        Hanya dapat diakses oleh ADMINISTRATOR.'
      operationId: list_datasets_api_v1_admin_datasets_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/datasets/sync:
    post:
      tags:
      - Administrator Workspace
      summary: Sync Dataset Inbox
      description: 'Sinkronisasi Manual Folder Inbox Dataset (CSV, TXT, JSONL).

        Mendeteksi ekstensi berkas, memvalidasi skema, dan merekam manifes impor.'
      operationId: sync_dataset_inbox_api_v1_admin_datasets_sync_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/admin/datasets/sync:
    post:
      tags:
      - Administrator Workspace
      - Administrator Workspace
      summary: Sync Dataset Inbox
      description: 'Sinkronisasi Manual Folder Inbox Dataset (CSV, TXT, JSONL).

        Mendeteksi ekstensi berkas, memvalidasi skema, dan merekam manifes impor.'
      operationId: sync_dataset_inbox_api_v1_admin_admin_datasets_sync_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/datasets/upload:
    post:
      tags:
      - Administrator Workspace
      summary: Upload Dataset File
      description: 'Mengunggah berkas dataset baru (CSV, TXT, JSONL) ke folder inbox
        terlindungi.

        Mencegah path traversal dan berkas tidak didukung.'
      operationId: upload_dataset_file_api_v1_admin_datasets_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_dataset_file_api_v1_admin_datasets_upload_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/admin/datasets/{id}/approve:
    post:
      tags:
      - Administrator Workspace
      summary: Approve Dataset Records
      description: 'Menyetujui (Approve) dataset klinis agar dapat diindeks dan diakses
        oleh Chatbot RAG.

        Data yang belum disetujui TIDAK AKAN PERNAH tersedia untuk pengguna biasa.'
      operationId: approve_dataset_records_api_v1_admin_datasets__id__approve_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/datasets/{id}/status:
    get:
      tags:
      - Administrator Workspace
      summary: Get Dataset Status
      description: Mengambil status impor, checksum, dan laporan karantina untuk berkas
        dataset tertentu.
      operationId: get_dataset_status_api_v1_admin_datasets__id__status_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/datasets/{id}/index:
    post:
      tags:
      - Administrator Workspace
      summary: Index Dataset
      description: Mengindeks rekam dataset yang telah disetujui ke SQLite FTS5 dan
        sqlite-vec.
      operationId: index_dataset_api_v1_admin_datasets__id__index_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/annotations:
    get:
      tags:
      - Administrator Workspace
      summary: List Annotations
      description: Mengambil daftar rekam anotasi klinis terawasi (Supervised Annotations).
      operationId: list_annotations_api_v1_admin_annotations_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Administrator Workspace
      summary: Submit Annotation
      description: Menyimpan atau memperbarui label anotasi terawasi untuk suatu rekam
        klinis.
      operationId: submit_annotation_api_v1_admin_annotations_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnotationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/exports/jsonl:
    get:
      tags:
      - Administrator Workspace
      summary: Download Exported Jsonl
      description: Mengunduh berkas kanonikal JSONL yang diekspor.
      operationId: download_exported_jsonl_api_v1_admin_exports_jsonl_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - Administrator Workspace
      summary: Export Datasets To Jsonl
      description: Menarik data dari database dan berkas CSV/TXT secara real-time
        ke canonical JSONL.
      operationId: export_datasets_to_jsonl_api_v1_admin_exports_jsonl_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/v1/admin/exports/sync-to-rag:
    post:
      tags:
      - Administrator Workspace
      summary: Sync Exported Jsonl To Rag
      description: 'Menyinkronkan data ekspor JSONL langsung ke basis data pengetahuan
        terverifikasi

        dan memicu re-indexing ke database vektor (sqlite-vec + FTS5).'
      operationId: sync_exported_jsonl_to_rag_api_v1_admin_exports_sync_to_rag_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/v1/admin/graph/all:
    get:
      tags:
      - Administrator Workspace
      summary: Get Knowledge Graph All
      description: 'Mengambil seluruh elemen simpul (nodes) dan relasi (edges) graf
        pengetahuan

        untuk visualisasi Cytoscape.js.'
      operationId: get_knowledge_graph_all_api_v1_admin_graph_all_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/v1/admin/graph/subgraph:
    get:
      tags:
      - Administrator Workspace
      summary: Get Knowledge Subgraph
      description: Subgraf di sekitar entitas klinis (mis. ?entity=Asma).
      operationId: get_knowledge_subgraph_api_v1_admin_graph_subgraph_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: entity
        in: query
        required: true
        schema:
          type: string
          title: Entity
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/graph/optimize-15pct:
    post:
      tags:
      - Administrator Workspace
      summary: Optimize Knowledge Graph 15Pct
      description: 'Code of Product 15% Graph & Database Optimization:

        Prunes peripheral noise edges and prioritizes top 15% core hub clinical entities.'
      operationId: optimize_knowledge_graph_15pct_api_v1_admin_graph_optimize_15pct_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/v1/admin/pipeline/simulate-modes:
    post:
      tags:
      - Administrator Workspace
      summary: Simulate Pipeline Modes
      description: 'Simulates:

        1. LCD Soft-Label Cross Entropy from synthetic data (teacher-taught + code-generated
        QA).

        2. Language Scanning & Neural Translation (Encoder-Decoder + Beam Search).

        3. Training loop with cosine LR decay, crash-safe checkpoints, and on-policy
        distillation.'
      operationId: simulate_pipeline_modes_api_v1_admin_pipeline_simulate_modes_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          description: Sample input
          default: dada sakit sesak napas tembus ke punggung
          title: Query
        description: Sample input
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/models/train:
    post:
      tags:
      - Administrator Workspace
      summary: Launch Training Job
      description: Meluncurkan background training job asinkron untuk model klasifikasi
        terawasi.
      operationId: launch_training_job_api_v1_admin_models_train_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainModelRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/admin/models/jobs:
    get:
      tags:
      - Administrator Workspace
      summary: List Training Jobs
      description: Mengambil daftar riwayat dan status training jobs asinkron.
      operationId: list_training_jobs_api_v1_admin_models_jobs_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/models/jobs/{job_id}:
    get:
      tags:
      - Administrator Workspace
      summary: Get Training Job Detail
      description: Mengambil rincian progress dan log real-time dari suatu training
        job.
      operationId: get_training_job_detail_api_v1_admin_models_jobs__job_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
